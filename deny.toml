# cargo-deny policy (REQUIREMENTS §12). Run: cargo deny --locked check

[graph]
# Check the dependencies of every feature, not only the default ones.
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained crates anywhere
# in the graph. An exception is added to `ignore` with its reason, never silently.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. MPL-2.0, the GPL family and non-open-source licences
# are excluded. Any licence not listed fails the check and is discussed case by
# case before it is added.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is the policy, not an inventory of what is in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known duplicate versions, each with why it exists and when it goes. The Makefile
# runs cargo-deny with `-D unmatched-skip`, so an entry that no longer matches fails
# CI: the pull request that removes a duplicate (usually a Dependabot lockfile
# update) must remove its entry too. Entries name a major version, not an exact one,
# so that patch releases do not fail CI.
skip = [
  # syn 2 and 3, both build-time only: procedural-macro dependencies, not linked into
  # vcrd. syn 3 comes from clap_derive and serde_derive. syn 2 comes from two crates:
  # - curve25519-dalek-derive 0.1.1 (the latest release, which requires syn 2), used
  #   by curve25519-dalek 5 on x86_64 for its SIMD backend;
  # - zerocopy-derive 0.8, in Cargo.lock but never built: zerocopy declares it under
  #   `cfg(any())`, a condition that is never true, to keep their versions in step.
  #   zerocopy comes from proptest, a dev-dependency, through rand_chacha.
  # Remove this entry when both have moved to syn 3.
  { crate = "syn@2", reason = "curve25519-dalek-derive 0.1.1 and zerocopy-derive 0.8 require syn 2; build-time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[workspace]
# Resolver 3 is edition 2024's default: it prefers dependency versions whose
# `rust-version` fits ours (REQUIREMENTS §7, §13).
resolver = "3"
members = ["vcrd-core", "vcrd-cli"]

# Crate roots scripts/check-lints-fire.sh plants its canaries in: one per lib or
# bin target. The script fails if a member is missing.
[workspace.metadata.lints-fire]
roots = ["vcrd-core/src/lib.rs", "vcrd-cli/src/main.rs"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Keep equal to the channel in rust-toolchain.toml (REQUIREMENTS §13).
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["David Chaiken <chaiken+vcrd@gmail.com>"]
repository = "https://github.com/davidchaiken/vcrd"
# Nothing is published before milestone 6 (DEVELOPMENT-PLAN.md).
publish = false

# Every dependency is declared here. CODEOWNERS covers this file, the member
# manifests and Cargo.lock (REQUIREMENTS §12).
[workspace.dependencies]
vcrd-core = { path = "vcrd-core", version = "0.0.0", default-features = false }
# JWS segments. default-features = false drops the default `simd-unsafe` feature.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# did:key identifiers: base58btc only (the multibase `z` prefix).
bs58 = "0.5"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0"
# Lexical checks against the grammars standards publish, such as XML Schema's
# dateTimeStamp. The patterns are ASCII, so the default Unicode tables are left out.
regex = { version = "1.13", default-features = false, features = ["std"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing", "formatting"] }
unsigned-varint = "0.8"
# URLs as VCDM 2.0 defines them, by the WHATWG URL Standard.
url = "2.5"
# Test-only (REQUIREMENTS §11).
assert_cmd = "2.2"
predicates = "3.1"
# Without the default fork, timeout and bit-set features, which bring tempfile and
# rusty-fork.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Also `#![forbid(unsafe_code)]` in each crate root; this copy reaches new crates
# (REQUIREMENTS §6).
unsafe_code = "forbid"

# No panics on untrusted input (REQUIREMENTS §6, §7). Test code is exempted by
# clippy.toml where clippy allows it. scripts/check-lints-fire.sh confirms that
# each of these fires.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[package]
name = "vcrd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vcrd"
path = "src/main.rs"

[features]
# std-clock is on here, not in core: the CLI is the frontend that *has* a clock.
default = ["jwt-vc", "std-clock"]
jwt-vc = ["vcrd-core/jwt-vc"]
std-clock = ["vcrd-core/std-clock"]
josekit-probe = ["vcrd-core/josekit-probe"]

[dependencies]
vcrd-core = { path = "../vcrd-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tabled.workspace = true
time.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
